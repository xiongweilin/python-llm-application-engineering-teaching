[project]
name = "python-llm-application-engineering-teaching"
version = "0.1.0"
description = "Course artifacts, practice checkers, and runtime scripts for the Python/LLM application engineering course"
requires-python = ">=3.10"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE", "PIE"]

[tool.ruff.lint.per-file-ignores]
# The practice checker converts any learner error into readable feedback by
# design; the answer file keeps `pass` stubs as deliberate exercise placeholders.
"practice/check_practice_0001.py" = ["BLE001"]
"practice/practice_0001_answers.py" = ["PIE790"]
# The content verifier carries long marker/contract tuples as data by design.
"runtime/verify-content.py" = ["E501"]
